<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtiFix 3D Viewer</title>
    <link rel="icon" href="https://raw.githubusercontent.com/alexcool-project/Artifix/main/docs/images/ArchiFix_cubo-logo.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            text-align: center;
            background: rgba(13,17,23,0.85);
            padding: 60px 40px;
            border-radius: 16px;
            border: 1px solid #21262d;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 12px rgba(74, 158, 255, 0.3));
        }
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            color: #4a9eff;
        }
        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #1f77b4 0%, #4a9eff 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.15s ease;
        }
        a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/alexcool-project/Artifix/main/docs/images/ArchiFix_cubo-logo.png" alt="ArtiFix" class="logo">
        <h1>ArtiFix 3D Viewer</h1>
        <p>
            Questo è il repository dei viewer 3D generati da ArtiFix.<br>
            Se hai ricevuto un link, aprirlo per visualizzare il modello 3D.
        </p>
        <a href="https://www.artifix.it" target="_blank" rel="noopener">
            Vai su ArtiFix.it →
        </a>
    </div>
</body>
</html>
