<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuraCap — ArtiFix 3D Viewer</title>
<link rel="icon" href="https://raw.githubusercontent.com/alexcool-project/mesh2u3d-viewer/main/assets/ArchiFix_cubo-logo.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e6edf3;
  }
  canvas { display: block; touch-action: none; }

  #artifix-logo {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    opacity: 0.55;
    transition: opacity 0.3s ease, transform 0.3s ease;
    text-decoration: none;
    display: block;
    pointer-events: auto;
  }
  #artifix-logo:hover {
    opacity: 1.0;
    transform: scale(1.08);
  }
  #artifix-logo img {
    width: 56px;
    height: 56px;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(74, 158, 255, 0.25));
  }

  /* --- ACTION BUTTONS (screenshot + download HTML) --- */
  #action-buttons {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
  }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid #21262d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    font-family: inherit;
  }
  .action-btn:hover {
    background: #21262d;
    border-color: #4a9eff;
    transform: translateY(-1px);
  }
  .action-btn:active {
    transform: translateY(0);
  }
  .action-btn.success {
    background: #1f4a2e;
    border-color: #2ecc71;
    color: #2ecc71;
  }
  .action-btn.error {
    background: #4a1f1f;
    border-color: #e74c3c;
    color: #e74c3c;
  }

  #info {
    position: absolute;
    top: 130px;
    left: 16px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid #21262d;
    font-size: 13px;
    line-height: 1.6;
    z-index: 5;
    min-width: 220px;
  }
  #info .project-name {
    font-weight: 600;
    font-size: 15px;
    color: #4a9eff;
    margin-bottom: 8px;
  }
  #info .stat {
    display: flex;
    justify-content: space-between;
    color: #8b949e;
  }
  #info .stat .value {
    color: #e6edf3;
    font-weight: 500;
  }

  #controls {
    position: absolute;
    top: 200px;
    right: 16px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #21262d;
    z-index: 5;
    width: 230px;
  }
  #controls .control-group {
    margin-bottom: 12px;
  }
  #controls .control-group:last-child {
    margin-bottom: 0;
  }
  #controls label {
    display: block;
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #controls input[type="range"] {
    width: 100%;
    accent-color: #4a9eff;
  }
  #controls .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #controls button {
    flex: 1;
    min-width: 60px;
    padding: 8px 10px;
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  #controls button:hover {
    background: #30363d;
    border-color: #4a9eff;
  }
  #controls button.active {
    background: #1f77b4;
    border-color: #4a9eff;
    color: #fff;
  }

  #reset-btn {
    position: absolute;
    bottom: 20px;
    right: 20px;
    padding: 10px 16px;
    background: rgba(13,17,23,0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid #21262d;
    border-radius: 8px;
    color: #e6edf3;
    font-size: 13px;
    cursor: pointer;
    z-index: 15;
    transition: all 0.15s ease;
    pointer-events: auto;
  }
  #reset-btn:hover {
    background: #21262d;
    border-color: #4a9eff;
  }

  #hints {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13,17,23,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    color: #8b949e;
    z-index: 5;
    pointer-events: none;
  }
  #hints span {
    margin: 0 8px;
  }
  #hints b {
    color: #4a9eff;
    font-weight: 500;
  }

  #info-mobile {
    display: none;
    position: absolute;
    top: 100px;
    left: 14px;
    background: rgba(13,17,23,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #21262d;
    font-size: 12px;
    line-height: 1.5;
    color: #8b949e;
    z-index: 5;
    max-width: 55%;
    pointer-events: none;
  }
  #info-mobile .name {
    font-size: 14px;
    font-weight: 600;
    color: #4a9eff;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #info-mobile .stat {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  #info-mobile .stat .value {
    color: #e6edf3;
    font-weight: 500;
  }

  #controls-toggle {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1f77b4 0%, #4a9eff 100%);
    border: none;
    color: #ffffff;
    font-size: 24px;
    cursor: pointer;
    z-index: 1000;
    box-shadow: 0 4px 16px rgba(74, 158, 255, 0.5);
    transition: transform 0.15s ease;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
  }
  #controls-toggle:active {
    transform: scale(0.9);
  }

  #controls-modal {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(13,17,23,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    border-top: 1px solid #21262d;
    padding: 20px;
    z-index: 2000;
    max-height: 70vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s ease;
    pointer-events: auto;
  }
  #controls-modal.open {
    transform: translateY(0);
  }
  #controls-modal .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #21262d;
  }
  #controls-modal .modal-header h3 {
    font-size: 16px;
    color: #4a9eff;
    font-weight: 600;
  }
  #controls-modal .close-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #21262d;
    border: none;
    color: #e6edf3;
    font-size: 18px;
    cursor: pointer;
    pointer-events: auto;
  }
  #controls-modal .control-group {
    margin-bottom: 18px;
  }
  #controls-modal label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #controls-modal input[type="range"] {
    width: 100%;
    accent-color: #4a9eff;
    height: 8px;
    pointer-events: auto;
  }
  #controls-modal .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  #controls-modal button.btn-control {
    flex: 1;
    min-width: 70px;
    padding: 14px 10px;
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s ease;
    pointer-events: auto;
    -webkit-appearance: none;
    appearance: none;
  }
  #controls-modal button.btn-control.active {
    background: #1f77b4;
    border-color: #4a9eff;
    color: #fff;
  }

  @media (max-width: 900px) {
    #info, #controls, #hints { display: none; }
    #info-mobile { display: block; }
    #controls-toggle { display: flex; align-items: center; justify-content: center; }
    #controls-modal { display: block; }

    #artifix-logo img { width: 42px; height: 42px; }
    #artifix-logo { top: 12px; right: 12px; }

    #action-buttons {
      top: 12px;
      left: 12px;
      flex-direction: row;
      gap: 6px;
    }
    .action-btn {
      padding: 8px 10px;
      font-size: 12px;
    }

    #reset-btn {
      bottom: 24px;
      right: 90px;
      padding: 12px 18px;
      font-size: 13px;
      border-radius: 28px;
      background: rgba(13,17,23,0.9);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  }

  #loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 20;
    color: #8b949e;
  }
  #loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #21262d;
    border-top-color: #4a9eff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  Caricamento modello 3D...
</div>

<a id="artifix-logo" href="https://www.artifix.it" target="_blank" rel="noopener" title="Visita ArtiFix.it">
  <img src="https://raw.githubusercontent.com/alexcool-project/mesh2u3d-viewer/main/assets/ArchiFix_cubo-logo.png" alt="ArtiFix">
</a>

<div id="action-buttons">
  <button class="action-btn" id="btn-screenshot" title="Salva uno screenshot professionale del modello">
    📸 Scatta foto
  </button>
  <button class="action-btn" id="btn-download-html" title="Salva il file HTML per aprirlo offline">
    💾 Scarica HTML
  </button>
</div>

<div id="info">
  <div class="project-name">AuraCap</div>
  <div class="stat"><span>Vertici</span><span class="value">12.572</span></div>
  <div class="stat"><span>Triangoli</span><span class="value">9.824</span></div>
  <div class="stat"><span>Formato</span><span class="value">OBJ</span></div>
</div>

<div id="info-mobile">
  <div class="name">AuraCap</div>
  <div class="stat"><span>Vertici</span><span class="value">12.572</span></div>
  <div class="stat"><span>Triangoli</span><span class="value">9.824</span></div>
  <div class="stat"><span>Formato</span><span class="value">OBJ</span></div>
</div>

<div id="controls">
  <div class="control-group">
    <label>Opacità</label>
    <input type="range" id="opacity-slider" min="10" max="100" value="100">
  </div>
  <div class="control-group">
    <label>Visualizzazione</label>
    <div class="row">
      <button id="btn-wireframe" title="Wireframe">📐</button>
      <button id="btn-grid" class="active" title="Griglia">▦</button>
      <button id="btn-axes" class="active" title="Assi">✛</button>
    </div>
  </div>
  <div class="control-group">
    <label>Materiale</label>
    <div class="row">
      <button id="btn-solid" class="active" title="Solido">◼</button>
      <button id="btn-flat" title="Flat">◧</button>
      <button id="btn-xray" title="X-Ray">◯</button>
    </div>
  </div>
</div>

<button id="controls-toggle" title="🎛️ Controlli">⚙️</button>

<div id="controls-modal">
  <div class="modal-header">
    <h3>🎛️ Controlli</h3>
    <button class="close-btn" id="controls-modal-close">✕</button>
  </div>

  <div class="control-group">
    <label>Opacità</label>
    <input type="range" id="opacity-slider-mobile" min="10" max="100" value="100">
  </div>

  <div class="control-group">
    <label>Visualizzazione</label>
    <div class="row">
      <button class="btn-control" id="btn-wireframe-mobile" title="Wireframe">📐</button>
      <button class="btn-control active" id="btn-grid-mobile" title="Griglia">▦</button>
      <button class="btn-control active" id="btn-axes-mobile" title="Assi">✛</button>
    </div>
  </div>

  <div class="control-group">
    <label>Materiale</label>
    <div class="row">
      <button class="btn-control active" id="btn-solid-mobile" title="Solido">◼</button>
      <button class="btn-control" id="btn-flat-mobile" title="Flat">◧</button>
      <button class="btn-control" id="btn-xray-mobile" title="X-Ray">◯</button>
    </div>
  </div>
</div>

<button id="reset-btn" title="Reset view">🔄 Reset</button>

<div id="hints">
  <span>🖱️ <b>Trascina ruota</b></span>
  <span>🔍 <b>Rotella zoom</b></span>
  <span>✋ <b>Destro pan</b></span>
</div>

function setMaterial(mode) {
  [btnSolid, btnFlat, btnXray, btnSolidMobile, btnFlatMobile, btnXrayMobile].forEach(b => b.classList.remove('active'));

  if (mode === 'solid') {
    material.flatShading = false;
    material.transparent = false;
    material.opacity = 1.0;
    material.color.setHex(0x4a9eff);
    material.needsUpdate = true;
    btnSolid.classList.add('active');
    btnSolidMobile.classList.add('active');
    setOpacity(100);
  } else if (mode === 'flat') {
    material.flatShading = true;
    material.transparent = false;
    material.opacity = 1.0;
    material.color.setHex(0x6bb6ff);
    material.needsUpdate = true;

    material.needsUpdate = true;

}

    const link = document.createElement('a');
    const safeTitle = PROJECT_TITLE.replace(/[^a-zA-Z0-9_-]/g, '_');
    const today = new Date().toISOString().split('T')[0];
    link.download = `${safeTitle}_${today}.png`;
    link.href = dataUrl;
    link.click();

    btn.classList.add('success');
    btn.textContent = '✅ Screenshot salvato!';
    setTimeout(() => {
      btn.classList.remove('success');
      btn.textContent = originalText;
    }, 2000);

  } catch (err) {
    console.error('Screenshot error:', err);
    btn.classList.add('error');
    btn.textContent = '❌ Errore durante lo screenshot';
    setTimeout(() => {
      btn.classList.remove('error');
      btn.textContent = originalText;
    }, 2000);
  }
});

// ---------- DOWNLOAD HTML BUTTON ----------
document.getElementById('btn-download-html').addEventListener('click', function() {
  const btn = this;
  const originalText = btn.textContent;

  try {
    // Recupera il sorgente HTML della pagina corrente
    const htmlSource = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

    // Crea il blob
    const blob = new Blob([htmlSource], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);

    // Crea il download
    const link = document.createElement('a');
    const today = new Date().toISOString().split('T')[0];
    const safeTitle = PROJECT_TITLE.replace(/[^a-zA-Z0-9_-]/g, '_');
    link.download = `${safeTitle}_${today}.html`;
    link.href = url;
    link.click();

    // Cleanup
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    btn.classList.add('success');
    btn.textContent = '✅ File HTML scaricato!';
    setTimeout(() => {
      btn.classList.remove('success');
      btn.textContent = originalText;
    }, 2000);

  } catch (err) {
    console.error('Download error:', err);
    btn.classList.add('error');
    btn.textContent = '❌ Errore durante lo screenshot';
    setTimeout(() => {
      btn.classList.remove('error');
      btn.textContent = originalText;
    }, 2000);
  }
});
</script>
